<!DOCTYPE html>

<title>MindAR Camera Test</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #status {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;

        padding: 12px 20px;

        background: black;
        color: white;

        border-radius: 10px;

        font-family: Arial, sans-serif;
        text-align: center;
    }
</style>
```

</head>

<body>

```
<div id="status">
    Starting camera...
</div>

<a-scene
    embedded
    mindar-image="imageTargetSrc: ./qr.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">

        <a-plane
            color="red"
            position="0 0 0"
            width="1"
            height="0.55">
        </a-plane>

    </a-entity>

</a-scene>

<script>
    const scene = document.querySelector("a-scene");
    const status = document.getElementById("status");
    const target = document.getElementById("target");

    scene.addEventListener("arReady", function () {
        console.log("AR READY");
        status.textContent = "Camera working. Point at your target.";
    });

    scene.addEventListener("arError", function (event) {
        console.error("AR ERROR:", event);

        status.textContent =
            "Camera/AR failed to start. Check camera permission.";
    });

    target.addEventListener("targetFound", function () {
        console.log("TARGET FOUND");

        status.textContent =
            "TARGET FOUND!";
    });

    target.addEventListener("targetLost", function () {
        console.log("TARGET LOST");

        status.textContent =
            "Camera working. Point at your target.";
    });
</script>
```

</body>
</html>
