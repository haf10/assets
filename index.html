<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>AR Clock</title>

<link rel="stylesheet" href="clock.css">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
```

</head>

<body>

```
<div id="overlay">
    <h1>AR Clock Project</h1>
    <p id="clock">00:00:00</p>
</div>

<a-scene
    embedded
    mindar-image="imageTargetSrc: ./qr.mind; autoStart: true; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-light
        type="ambient"
        intensity="1">
    </a-light>

    <a-entity
        id="ar-target"
        mindar-image-target="targetIndex: 0">

        <a-cylinder
            position="0 0 0"
            rotation="90 0 0"
            radius="0.8"
            height="0.05"
            color="white">
        </a-cylinder>

        <a-sphere
            position="0 0 0.05"
            radius="0.05"
            color="black">
        </a-sphere>

        <a-box
            id="hourHand"
            position="0 0.18 0.1"
            width="0.05"
            height="0.35"
            depth="0.03"
            color="black">
        </a-box>

        <a-box
            id="minuteHand"
            position="0 0.25 0.12"
            width="0.04"
            height="0.5"
            depth="0.03"
            color="blue">
        </a-box>

        <a-box
            id="secondHand"
            position="0 0.3 0.15"
            width="0.02"
            height="0.6"
            depth="0.02"
            color="red">
        </a-box>

    </a-entity>

</a-scene>

<script src="clock.js"></script>
```

</body>
</html>
