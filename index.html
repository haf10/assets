<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Clock</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>Current Time</h1>
        <div id="clock">00:00:00</div>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: ./qr.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, logarithmicDepthBuffer: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="0.6" radius-outer="0.65" color="#333333"></a-ring>
            <a-circle position="0 0 -0.001" rotation="-90 0 0" radius="0.6" color="#FFFFFF" opacity="0.9"></a-circle>
            <a-cylinder position="0 0.01 0" rotation="90 0 0" radius="0.03" height="0.02" color="#111111"></a-cylinder>

            <a-entity id="hourHand" position="0 0.015 0" rotation="0 0 0">
                <a-box position="0 0.15 0" width="0.04" height="0.3" depth="0.01" color="#111111"></a-box>
            </a-entity>

            <a-entity id="minuteHand" position="0 0.02 0" rotation="0 0 0">
                <a-box position="0 0.22 0" width="0.025" height="0.44" depth="0.01" color="#333333"></a-box>
            </a-entity>

            <a-entity id="secondHand" position="0 0.025 0" rotation="0 0 0">
                <a-box position="0 0.25 0" width="0.01" height="0.5" depth="0.005" color="#E74C3C"></a-box>
            </a-entity>
        </a-entity>

    </a-scene>

    <script src="app.js"></script>
</body>
</html>
