<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Clock</title>
    <!-- Linked to your CSS tab -->
    <link rel="stylesheet" href="clock.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>AR Clock Project</h1>
        <p id="clock">00:00:00</p>
        <button onclick="openWebsite()">Enter Website</button>
    </div>

 <a-scene
    embedded
    mindar-image="imageTargetSrc: ./qr.mind; autoStart: true;"
    vr-mode-ui="enabled:false;">

<a-assets>

<a-asset-item
id="clockModel"
src="./clock.glb">
</a-asset-item>
</a-assets>

<a-camera position="0 0 0"></a-camera>


<a-entity 
    id="ar-target"
    mindar-image-target="targetIndex:0">

<a-entity
gltf-model="#clockModel"
position="0 0 0.2"
scale="0.5 0.5 0.5">
</a-entity>

</a-entity>

</a-scene>

    <!-- Linked to your JS tab -->
    <script src="clock.js"></script>
</body>
</html>
