<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Clock</title>
    <link rel="stylesheet" href="clock.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>Current Time</h1>
        <div id="clock">Loading...</div>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: ./qr.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, logarithmicDepthBuffer: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

       <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    
    <a-circle position="0 0 0" radius="0.5" color="#FAFAFA"></a-circle>
    <a-ring position="0 0 0.005" radius-inner="0.5" radius-outer="0.53" color="#333333"></a-ring>

    <a-entity rotation="0 0 0"><a-box position="0 0.43 0.01" width="0.02" height="0.08" depth="0.01" color="#333333"></a-box></a-entity>
    <a-entity rotation="0 0 -30"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -60"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -90"><a-box position="0 0.43 0.01" width="0.02" height="0.08" depth="0.01" color="#333333"></a-box></a-entity>
    <a-entity rotation="0 0 -120"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -150"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -180"><a-box position="0 0.43 0.01" width="0.02" height="0.08" depth="0.01" color="#333333"></a-box></a-entity>
    <a-entity rotation="0 0 -210"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -240"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -270"><a-box position="0 0.43 0.01" width="0.02" height="0.08" depth="0.01" color="#333333"></a-box></a-entity>
    <a-entity rotation="0 0 -300"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>
    <a-entity rotation="0 0 -330"><a-box position="0 0.44 0.01" width="0.01" height="0.04" depth="0.01" color="#888888"></a-box></a-entity>

    <a-text value="12" position="0 0.35 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="1" position="0.175 0.303 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="2" position="0.303 0.175 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="3" position="0.35 0 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="4" position="0.303 -0.175 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="5" position="0.175 -0.303 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="6" position="0 -0.35 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="7" position="-0.175 -0.303 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="8" position="-0.303 -0.175 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="9" position="-0.35 0 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="10" position="-0.303 0.175 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>
    <a-text value="11" position="-0.175 0.303 0.01" align="center" baseline="center" color="#111111" width="2"></a-text>

    <a-entity id="hourHand" position="0 0 0.02" rotation="0 0 0">
        <a-box position="0 0.12 0" width="0.035" height="0.25" depth="0.01" color="#222222"></a-box>
    </a-entity>

    <a-entity id="minuteHand" position="0 0 0.03" rotation="0 0 0">
        <a-box position="0 0.18 0" width="0.025" height="0.38" depth="0.01" color="#444444"></a-box>
    </a-entity>

    <a-entity id="secondHand" position="0 0 0.04" rotation="0 0 0">
        <a-box position="0 0.20 0" width="0.01" height="0.45" depth="0.01" color="#E74C3C"></a-box>
        <a-box position="0 -0.05 0" width="0.01" height="0.10" depth="0.01" color="#E74C3C"></a-box>
    </a-entity>

    <a-cylinder position="0 0 0.05" rotation="90 0 0" radius="0.03" height="0.015" color="#111111"></a-cylinder>

</a-entity>
    </a-scene>
